    default_effort: medium
    efforts:
      low: {reasoning: {effort: low}}
      medium: {reasoning: {effort: medium}}
      high: {reasoning: {effort: high}}
    effort_tiers: {low: low, medium: medium, high: high}
    notes: "Through OpenRouter, on OpenAI's flex tier."

  # ---------------------------------------------------------------- Google
  # Thinking level low, medium or high (no minimal); the API default is medium.
  - id: gemini-3.8-flash
    provider: openrouter
    endpoint_model: google/gemini-3.8-flash
    display: Gemini 3.8 Flash
    family: Gemini
    base_model: Gemini-3.8-Flash
