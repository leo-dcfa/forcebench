  # ---------------------------------------------------------------- open weights, vendor-served
  # Served by the model's own vendor where OpenRouter has its endpoint, else by a provider that
  # serves the precision it declares. Sampling as the vendor recommends (as in models/local.yaml),
  # so these runs compare with the local quantisations of the same base model.

