  # Thinking off, high or max; OpenRouter's xhigh selects max. Z.AI's endpoint, sent no effort,
  # reasons about as long as at high.
  - id: glm-5.2-zai-fp8
    provider: openrouter
    endpoint_model: z-ai/glm-5.2
    display: GLM-5.2
    developer: zai
    family: GLM-5.2
    base_model: GLM-5.2
    quant: FP8
    engine: Unknown
    local: false
    context: 1048576
