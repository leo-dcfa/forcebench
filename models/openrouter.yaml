    default_effort: high
    efforts:
      "off": {reasoning: {enabled: false}}
      high: {reasoning: {effort: high}}
      max: {reasoning: {effort: xhigh}}
    effort_tiers: {"off": "off", high: high, max: max}
    notes: "Through OpenRouter, served by Z.AI at FP8 (as it declares)."

  # Thinking is always on, and max is the only effort Moonshot accepts so far (its default), so
  # nothing is sent. Sampling is fixed by Moonshot's API.
  - id: kimi-k3-moonshot
