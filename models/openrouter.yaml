  # ---------------------------------------------------------------- open weights, free endpoints
  # OpenRouter's free endpoints, served by the vendor. They are rate-limited (requests per minute
  # and per day), so a run may need --resume to finish. Each is a thinking switch, on unless
  # turned off.
  - id: nemotron-3-ultra-nvidia
    provider: openrouter
    endpoint_model: nvidia/nemotron-3-ultra-550b-a55b:free
    display: Nemotron 3 Ultra
    family: Nemotron-3
    base_model: Nemotron-3-Ultra-550B-A55B
    quant: Unknown
    engine: Unknown
    local: false
    context: 1000000
    sampling: {provider: {only: [nvidia], allow_fallbacks: false}}
    default_effort: "on"
    efforts:
      "off": {reasoning: {enabled: false}}
      "on": {reasoning: {enabled: true}}
    effort_tiers: {"off": "off", "on": "on"}
    notes: "Through OpenRouter's free endpoint, served by NVIDIA."

