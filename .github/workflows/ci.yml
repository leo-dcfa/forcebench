name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Cache LWC Jest workspace
        uses: actions/cache@v4
        with:
          path: .cache/lwc-jest/node_modules
          key: lwc-jest-${{ runner.os }}-node24-${{ hashFiles('src/forcebench/data/lwc-jest/package-lock.json') }}
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Type check
        # pyright, configured in pyproject.toml ([tool.pyright]). The files listed had type errors
        # when this check was added and are skipped until they pass; every other file, new ones
        # included, must pass. Take a file off the list once it is fixed.
        env:
          PYRIGHT_BASELINE: |-
            src/forcebench/data/scratch-def-build.py
            src/forcebench/graders/ci.py
            src/forcebench/graders/org.py
            src/forcebench/graders/scratch_def.py
            src/forcebench/graders/sf_cli.py
            tests/test_ci_grader.py
            tests/test_scratch_def.py
            tests/test_sf_cli.py
            tests/test_tasks.py
        run: git ls-files 'src/*.py' 'tests/*.py' | grep -vxF "$PYRIGHT_BASELINE" | xargs uvx pyright@1.1.414
      - name: Unit tests
        run: uv run pytest -q
      - name: Nothing from the private pool
        # Allowlist rules over every tracked file (src/forcebench/leakcheck.py): only the public
        # canary, only public task files. They need no secrets.
        run: uv run forcebench leakcheck
      - name: Leaderboard is up to date
        # results/leaderboard.json and LEADERBOARD.md must be what `forcebench report` builds
        # from the committed runs and tasks (apart from generated_at): a change to the report,
        # a task or a run must come with the rebuilt leaderboard.
        run: uv run forcebench report --check
      - name: Oracle-validate tasks that need no org
        # Tasks that need a scratch org are reported as skipped here; a maintainer
        # validates them against grader orgs before merging.
        run: uv run forcebench validate --no-org
